services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zentra
      POSTGRES_USER: zentra_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ZENTRA_TENANT_PASSWORD_FILE: /run/secrets/tenant_db_password
      ZENTRA_AUTH_PASSWORD_FILE: /run/secrets/auth_db_password
      ZENTRA_PLATFORM_PASSWORD_FILE: /run/secrets/platform_db_password
    secrets:
      - postgres_password
      - tenant_db_password
      - auth_db_password
      - platform_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/multitenancy-trial-migration.sql:/docker-entrypoint-initdb.d/02-multitenancy.sql:ro
      - ./database/estado-de-cuenta-migration.sql:/docker-entrypoint-initdb.d/03-estado-cuenta.sql:ro
      - ./database/verify-tenant-isolation.sql:/docker-entrypoint-initdb.d/04-verify.sql:ro
      - ./database/docker-init-roles.sh:/docker-entrypoint-initdb.d/05-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentra_owner -d zentra"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3011
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: zentra
      DB_USER: zentra_tenant
      DB_PASSWORD_FILE: /run/secrets/tenant_db_password
      AUTH_DB_USER: zentra_auth
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      PLATFORM_DB_USER: zentra_platform
      PLATFORM_DB_PASSWORD_FILE: /run/secrets/platform_db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      CORS_ORIGIN: https://${DOMAIN:?Configura DOMAIN en .env}
      DB_SSL: disable
      WEBSITE_ANALYTICS_URL: ${WEBSITE_ANALYTICS_URL:-https://botenginecorp.com}
      WEBSITE_ANALYTICS_KEY: ${WEBSITE_ANALYTICS_KEY:-}
      # Integraciones: llave para cifrar credenciales y servidores externos permitidos (separados por coma).
      INTEGRATIONS_KEY_FILE: /run/secrets/integrations_key
      INTEGRATIONS_ALLOWED_HOSTS: ${INTEGRATIONS_ALLOWED_HOSTS:-}
      # Correos a clientes (verificación y credenciales) por la API de Brevo.
      EMAIL_API_KEY_FILE: /run/secrets/email_api_key
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-BotEngine ERP}
      SOPORTE_CORREO: ${SOPORTE_CORREO:-}
      # Forma de pago que sale en las facturas a clientes (banco, cuenta, a nombre de quién).
      FACTURA_DATOS_PAGO: ${FACTURA_DATOS_PAGO:-}
      # Dirección por empresa: <empresa>.BASE_DOMAIN, soporte.BASE_DOMAIN y BASE_DOMAIN para el
      # inicio de sesión general (ver backend/src/utils/dominios.js). Vacío = una sola dirección.
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      # Enlaces de los correos de verificación (por ejemplo https://botengine-erp.com).
      APP_URL: ${APP_URL:-}
    # Permite llegar a una base de datos instalada en el mismo servidor, fuera de Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - integrations_key
      - email_api_key
      - tenant_db_password
      - auth_db_password
      - platform_db_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3011/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # egress: salida a internet solo para leer las visitas del sitio web
    networks: [backend, egress]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["node", "run-multitenancy-migration.js"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: zentra
      DB_USER: zentra_owner
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      DB_SSL: disable
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  bootstrap-admin:
    profiles: [setup]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["node", "create-platform-admin.js"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: zentra
      PLATFORM_DB_USER: zentra_platform
      PLATFORM_DB_PASSWORD_FILE: /run/secrets/platform_db_password
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Soporte Zentra}
      PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/platform_admin_password
      DB_SSL: disable
    secrets:
      - platform_db_password
      - platform_admin_password
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN en .env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /config:size=16m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    # automatizaciones: para servir el portal de pruebas en /pruebas (pestaña del panel de soporte)
    networks: [frontend, backend, automatizaciones]

  # ---------- Automatizaciones (pestaña del panel de soporte) ----------
  # Portal AutomatizacionBotEngine (Java/Spring + Selenium) en modo ligero: Chrome sin ventana
  # va dentro del mismo contenedor y solo corre durante cada prueba (sin Selenium Grid ni video).
  # Solo arranca con COMPOSE_PROFILES=automatizaciones en .env. Caddy lo publica en /pruebas y
  # solo deja pasar a quien tenga sesión de soporte.
  # Memoria: tiene tope y, si al servidor le falta, el sistema mata primero estos contenedores
  # (oom_score_adj alto) y nunca al ERP ni a la web.
  automatizaciones:
    profiles: [automatizaciones]
    build:
      context: ./automatizaciones
      args:
        BOTENGINE_REF: ${AUTOMATIZACIONES_REF:-prod}
    restart: unless-stopped
    mem_limit: 700m
    oom_score_adj: 900
    environment:
      TZ: America/Guatemala
      # Java con poca memoria; modo local = Chrome dentro de este contenedor.
      JAVA_OPTS: >-
        -Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m
        -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
        -Dbotengine.selenium.modo=local
      SERVER_PORT: 8081
      SERVER_SERVLET_CONTEXT_PATH: /pruebas
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_TOMCAT_THREADS_MAX: 16
      SERVER_TOMCAT_THREADS_MIN_SPARE: 2
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      SPRING_DATASOURCE_URL: jdbc:postgresql://automatizaciones-db:5432/automatizacion_botengine
      SPRING_DATASOURCE_USERNAME: botengine_app
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      BOTENGINE_ADMIN_USERNAME: admin
      # Parámetros del framework Selenium (config.properties del repositorio)
      BASE_URL: http://localhost:8081/pruebas/login
      BROWSER: chrome
      HEADLESS: "true"
      TIMEOUT_SECONDS: 15
      EVIDENCE_PATH: reportes/evidencias
    secrets:
      - automatizaciones_db_password
      - automatizaciones_admin_password
      - automatizaciones_credential_key
    volumes:
      - automatizaciones_storage:/app/storage
      # Videos de ejecuciones anteriores (las nuevas no graban video).
      - automatizaciones_videos:/app/storage/selenium-videos
      - automatizaciones_reportes:/app/reportes
    depends_on:
      automatizaciones-db:
        condition: service_healthy
    # El framework cambia «localhost» por host.docker.internal (pensado para Chrome en otro
    # contenedor). Aquí Chrome corre dentro de este mismo contenedor: que apunte a sí mismo.
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    security_opt:
      - no-new-privileges:true
    networks:
      automatizaciones:
        # Caddy lo encuentra con este nombre.
        aliases: [automatizaciones-portal]
      # Salida a internet para abrir los sitios que se prueban (y bajar ChromeDriver).
      egress:

  automatizaciones-db:
    profiles: [automatizaciones]
    image: postgres:17-alpine
    restart: unless-stopped
    # Base pequeña: pocos datos y pocas conexiones.
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    mem_limit: 128m
    oom_score_adj: 600
    environment:
      POSTGRES_DB: automatizacion_botengine
      POSTGRES_USER: botengine_app
      POSTGRES_PASSWORD_FILE: /run/secrets/automatizaciones_db_password
    secrets:
      - automatizaciones_db_password
    volumes:
      - automatizaciones_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botengine_app -d automatizacion_botengine"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [automatizaciones]

volumes:
  postgres_data:
  caddy_data:
  automatizaciones_pgdata:
  automatizaciones_storage:
  automatizaciones_videos:
  automatizaciones_reportes:

networks:
  frontend:
  backend:
    internal: true
  egress:
  automatizaciones:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  tenant_db_password:
    file: ./secrets/tenant_db_password.txt
  auth_db_password:
    file: ./secrets/auth_db_password.txt
  platform_db_password:
    file: ./secrets/platform_db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  platform_admin_password:
    file: ./secrets/platform_admin_password.txt
  integrations_key:
    file: ./secrets/integrations_key.txt
  email_api_key:
    file: ./secrets/email_api_key.txt
  automatizaciones_db_password:
    file: ./secrets/automatizaciones_db_password.txt
  automatizaciones_admin_password:
    file: ./secrets/automatizaciones_admin_password.txt
  automatizaciones_credential_key:
    file: ./secrets/automatizaciones_credential_key.txt
