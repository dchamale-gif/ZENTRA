# Sitio de nginx para BotEngine ERP en modo proxy.
# configurar-dominio.sh --nginx genera una copia con el dominio y el puerto ya puestos.
# Después de copiarlo a /etc/nginx/sites-available/ ejecuta certbot --nginx -d __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Las importaciones masivas envían archivos de hasta 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
