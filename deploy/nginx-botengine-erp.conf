# nginx para BotEngine ERP con dirección por empresa (modo proxy, Caddy en 127.0.0.1:8088):
#   botengine-erp.com         inicio de sesión general y registro
#   soporte.botengine-erp.com panel de soporte y portal de automatizaciones (/pruebas)
#   <empresa>.botengine-erp.com el ERP de cada empresa
# Certificado comodín (válido para todas las empresas, también las nuevas), emitido con:
#   certbot certonly --dns-digitalocean --dns-digitalocean-credentials /root/.secrets/digitalocean.ini \
#     --cert-name botengine-erp.com -d botengine-erp.com -d '*.botengine-erp.com' -d '*.med.botengine-erp.com'
# MED (hsc.med.botengine-erp.com) tiene su propio sitio de nginx: es otra aplicación.
server {
    listen 80;
    listen [::]:80;
    server_name botengine-erp.com *.botengine-erp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name botengine-erp.com *.botengine-erp.com;

    ssl_certificate /etc/letsencrypt/live/botengine-erp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botengine-erp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → sin www.
    if ($host = www.botengine-erp.com) {
        return 301 https://botengine-erp.com$request_uri;
    }

    # Las importaciones masivas envían archivos de hasta 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Portal de automatizaciones: cada ejecución espera a que termine la prueba en Chrome.
    location /pruebas/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;
    }
}
